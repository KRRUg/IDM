when@prod:
    sentry:
        dsn: '%env(SENTRY_DSN)%'

#        If you are using Monolog, you also need these additional configuration and services to log the errors correctly:
#        https://docs.sentry.io/platforms/php/guides/symfony/#monolog-integration
        register_error_listener: false
        options:
            ignore_exceptions:
                - Symfony\Component\HttpKernel\Exception\NotFoundHttpException
                - Symfony\Component\HttpKernel\Exception\AccessDeniedHttpException
                - Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException
                - Symfony\Component\HttpKernel\Exception\TooManyRequestsHttpException
                - Symfony\Component\HttpKernel\Exception\UnsupportedMediaTypeHttpException
                - Symfony\Component\HttpKernel\Exception\UnprocessableEntityHttpException

    monolog:
        handlers:
            sentry:
                type: service
                id: Sentry\Monolog\Handler

    services:
        Sentry\Monolog\Handler:
            arguments:
                $hub: '@Sentry\State\HubInterface'
                $level: !php/const Monolog\Logger::ERROR
                $bubble: false
